spring.application.name=backend
server.port=8080
server.address=0.0.0.0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Persistencia Cloud Spring Data JPA (PostgreSQL / Fallback H2 en memoria)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:pedidos360db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Configuración OAuth2 Resource Server para Amazon Cognito
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${COGNITO_JWK_SET_URI:}

# Mensajeria RabbitMQ (EP3): el backend publica los eventos de pedidos
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673,localhost:5674}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASS:admin123}
# Sin broker (p. ej. ECS de la EA1) la API no debe colgarse ni marcarse DOWN
spring.rabbitmq.connection-timeout=2s
management.health.rabbit.enabled=false
mensajeria.exchanges.eventos=pedidos.eventos
mensajeria.exchanges.eventos-routing-key=pedido.%s
mensajeria.exchanges.documentos=pedidos.documentos
mensajeria.documentos.routing-key=documento.factura
