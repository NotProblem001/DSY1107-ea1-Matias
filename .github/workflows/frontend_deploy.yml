name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend_deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend Deploy (AWS Amplify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUTA_BUILD: frontend/dist
      REGION_DEFAULT: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dar permisos de ejecución a los scripts
        run: chmod +x scripts/*.sh || true

      - name: Generar o inyectar config.json
        env:
          REGION: ${{ vars.AWS_REGION || env.REGION_DEFAULT }}
          COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
          CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          REDIRECT_URI: ${{ vars.REDIRECT_URI }}
          API_URL: ${{ vars.API_URL }}
          EXIGIR_HTTPS: '0'
        run: |
          if [ -n "$COGNITO_DOMAIN" ] && [ -n "$CLIENT_ID" ] && [ -n "$REDIRECT_URI" ]; then
            scripts/config-frontend.sh
          else
            echo "Aviso: Variables completas de Cognito no detectadas en GitHub Actions. Usando config.example.json..."
            mkdir -p frontend/public
            cp frontend/public/config.example.json frontend/public/config.json || true
          fi

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Compilar Frontend (React + Vite)
        working-directory: frontend
        run: npm run build

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || env.REGION_DEFAULT }}

      - name: Desplegar en AWS Amplify
        env:
          APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          RAMA: ${{ vars.AMPLIFY_BRANCH || 'main' }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ]; then
            echo "Buscando APP_ID existente en AWS Amplify..."
            APP_ID=$(aws amplify list-apps --query "apps[?name=='dsy1107-Matias-Araos'].appId" --output text || true)
            if [ -z "$APP_ID" ] || [ "$APP_ID" = "None" ]; then
              APP_ID=$(aws amplify list-apps --query "apps[0].appId" --output text || true)
            fi
          fi

          if [ -z "$APP_ID" ] || [ "$APP_ID" = "None" ]; then
            echo "::error::No se pudo determinar el APP_ID de Amplify. Por favor configura vars.AMPLIFY_APP_ID."
            exit 1
          fi

          echo "Publicando en Amplify App ID: $APP_ID, Rama: $RAMA desde $RUTA_BUILD"
          scripts/publicar-amplify.sh "$APP_ID" "$RAMA" "$RUTA_BUILD"
          echo "APP_ID_FINAL=$APP_ID" >> "$GITHUB_ENV"

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Despliegue de Frontend en Amplify"
            echo ""
            echo "- **App ID**: \`${APP_ID_FINAL:-No resuelto}\`"
            echo "- **Directorio publicado**: \`${RUTA_BUILD}\`"
            echo "- **URL esperada**: ${REDIRECT_URI:-Revisar consola de AWS Amplify}"
          } >> "$GITHUB_STEP_SUMMARY"
