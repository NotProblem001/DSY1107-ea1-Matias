name: User Token MS Deploy

on:
  push:
    branches: [main]
    paths:
      - 'user-token-ms/**'
      - '.github/workflows/user_token_ms_deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: user-token-ms-deploy
  cancel-in-progress: false

jobs:
  lambda:
    name: user-token-ms (Lambda Pre-Token V2)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FUNCION: ${{ vars.LAMBDA_USER_TOKEN_MS || 'user-token-ms-matias-araos' }}
      REGION_DEFAULT: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar pruebas unitarias (node --test)
        working-directory: user-token-ms
        run: node --test

      - name: Empaquetar microservicio (.zip)
        working-directory: user-token-ms
        run: zip -j ../user-token-ms.zip index.mjs

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || env.REGION_DEFAULT }}

      - name: Actualizar código en AWS Lambda
        run: |
          set -euo pipefail
          echo "Verificando disponibilidad de la función Lambda: $FUNCION"

          echo "Esperando que la función Lambda esté activa y lista para actualizaciones..."
          for i in $(seq 1 30); do
            STATE=$(aws lambda get-function-configuration --function-name "$FUNCION" --query 'State' --output text 2>/dev/null || true)
            UPDATE_STATUS=$(aws lambda get-function-configuration --function-name "$FUNCION" --query 'LastUpdateStatus' --output text 2>/dev/null || true)
            echo "Estado actual de Lambda: State=$STATE, LastUpdateStatus=$UPDATE_STATUS (intento $i/30)"
            if [ "$STATE" = "Active" ] && [ "$UPDATE_STATUS" != "InProgress" ]; then
              echo "Lambda lista para actualización."
              break
            fi
            sleep 5
          done

          echo "Actualizando código de la función Lambda..."
          ACTUALIZADO=0
          for i in $(seq 1 10); do
            if aws lambda update-function-code \
                --function-name "$FUNCION" \
                --zip-file fileb://user-token-ms.zip \
                --query 'CodeSha256' --output text; then
              ACTUALIZADO=1
              break
            else
              echo "Aviso: Error temporal al actualizar código (posible conflicto o inicialización en progreso). Reintentando en 6s... (intento $i/10)"
              sleep 6
            fi
          done

          if [ "$ACTUALIZADO" -ne 1 ]; then
            echo "::error::No se pudo actualizar el código de la función Lambda tras 10 intentos."
            exit 1
          fi

          echo "Esperando que la actualización del Lambda finalice..."
          for i in $(seq 1 30); do
            UPDATE_STATUS=$(aws lambda get-function-configuration --function-name "$FUNCION" --query 'LastUpdateStatus' --output text 2>/dev/null || true)
            echo "Estado de la actualización: $UPDATE_STATUS (intento $i/30)"
            if [ "$UPDATE_STATUS" = "Successful" ]; then
              echo "Función Lambda actualizada correctamente."
              break
            fi
            if [ "$UPDATE_STATUS" = "Failed" ]; then
              echo "::error::La actualización de la función Lambda falló."
              exit 1
            fi
            sleep 3
          done

      - name: Comprobar el Lambda desplegado (Smoke Test)
        run: |
          set -euo pipefail

          cat > evento.json <<'JSON'
          {
            "version": "2",
            "triggerSource": "TokenGeneration_HostedAuth",
            "userName": "smoke-test",
            "request": {
              "userAttributes": { "email": "smoke@ci" },
              "groupConfiguration": { "groupsToOverride": ["solicitantes"] }
            },
            "response": {}
          }
          JSON

          aws lambda invoke \
            --function-name "$FUNCION" \
            --payload fileb://evento.json \
            --cli-read-timeout 30 \
            salida.json > /dev/null

          scopes=$(jq -c '.response.claimsAndScopeOverrideDetails.accessTokenGeneration.scopesToAdd' salida.json)
          echo "Scopes devueltos para un solicitante: $scopes"

          if [ "$scopes" != '["solicitudes/read","solicitudes/write"]' ]; then
            echo "::error::El Lambda desplegado no concede los scopes esperados: $scopes"
            jq . salida.json
            exit 1
          fi

          {
            echo "### Lambda Pre-Token V2 Desplegado"
            echo ""
            echo "Verificación: Usuario en grupo \`solicitantes\` recibe: \`${scopes}\`"
          } >> "$GITHUB_STEP_SUMMARY"
