name: Backend Compile

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend_compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permisos de ejecución al Maven Wrapper
        run: chmod +x backend/mvnw

      - name: Compilar y ejecutar pruebas Maven
        working-directory: backend
        run: ./mvnw --batch-mode clean test
