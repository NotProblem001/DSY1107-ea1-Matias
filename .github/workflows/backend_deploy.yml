name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend_deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  backend:
    name: Backend Deploy (ECS Fargate)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CONTENEDOR: backend
      REGION_DEFAULT: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permisos de ejecución
        run: |
          chmod +x backend/mvnw
          chmod +x scripts/*.sh || true

      - name: Compilar artefacto JAR
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

      - name: Generar etiqueta de versión
        id: version
        run: echo "tag=v$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || env.REGION_DEFAULT }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticación en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y publicar imagen Docker (linux/amd64)
        env:
          REPO: ${{ vars.ECR_REPO }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$REPO" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REGION="${{ vars.AWS_REGION || env.REGION_DEFAULT }}"
            REPO="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/dsy1107-backend-matias-araos"
          fi
          echo "Publicando imagen en ECR: $REPO:$TAG y $REPO:latest"
          docker buildx build --platform linux/amd64 -t "$REPO:$TAG" -t "$REPO:latest" --push backend
          echo "REPO_FINAL=$REPO" >> "$GITHUB_ENV"

      - name: Actualizar Task Definition y Desplegar en ECS Fargate
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER || 'dsy1107-cluster-matias-araos' }}
          SERVICIO: ${{ vars.ECS_SERVICE || 'dsy1107-backend-matias-araos' }}
          REPO: ${{ env.REPO_FINAL }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Descargando task definition activa para el servicio: $SERVICIO"
          aws ecs describe-task-definition --task-definition "$SERVICIO" \
            --query taskDefinition --output json \
            | jq --arg img "$REPO:$TAG" '.containerDefinitions[0].image = $img | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
            > task-definition.json

          echo "Registrando nueva revisión en ECS..."
          NUEVA_REV=$(aws ecs register-task-definition --cli-input-json file://task-definition.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Nueva revisión: $NUEVA_REV"

          echo "Actualizando servicio $SERVICIO con la nueva revisión..."
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICIO" --task-definition "$NUEVA_REV" > /dev/null

          echo "Esperando que el servicio alcance estabilidad..."
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICIO"
          echo "Servicio estabilizado exitosamente."

      - name: Reapuntar API Gateway a la IP de la nueva tarea
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER || 'dsy1107-cluster-matias-araos' }}
          SERVICIO: ${{ vars.ECS_SERVICE || 'dsy1107-backend-matias-araos' }}
          API_ID: ${{ vars.API_ID }}
          INT_PUB: ${{ vars.INTEGRATION_PUBLICO_INFO_ID || vars.INTEGRATION_ID }}
          INT_SOL_COL: ${{ vars.INTEGRATION_SOLICITUDES_COL_ID || vars.INTEGRATION_PRODUCTOS_COL_ID }}
          INT_SOL_ELE: ${{ vars.INTEGRATION_SOLICITUDES_ELE_ID || vars.INTEGRATION_PRODUCTOS_ELE_ID }}
          INT_SOL_APR: ${{ vars.INTEGRATION_SOLICITUDES_APR_ID }}
          INT_SOL_REC: ${{ vars.INTEGRATION_SOLICITUDES_REC_ID }}
        run: |
          set -euo pipefail
          if [ -n "$API_ID" ]; then
            TAREA=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICIO" --desired-status RUNNING --query "taskArns[0]" --output text)
            ENI=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TAREA" --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text)
            IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI" --query "NetworkInterfaces[0].Association.PublicIp" --output text)

            if [ -n "$IP" ] && [ "$IP" != "None" ]; then
              echo "Reapuntando API Gateway ($API_ID) hacia http://${IP}:8080"
              [ -n "$INT_PUB" ] && aws apigatewayv2 update-integration --api-id "$API_ID" --integration-id "$INT_PUB" --integration-uri "http://${IP}:8080/publico/info" > /dev/null || true
              [ -n "$INT_SOL_COL" ] && aws apigatewayv2 update-integration --api-id "$API_ID" --integration-id "$INT_SOL_COL" --integration-uri "http://${IP}:8080/solicitudes" > /dev/null || true
              [ -n "$INT_SOL_ELE" ] && aws apigatewayv2 update-integration --api-id "$API_ID" --integration-id "$INT_SOL_ELE" --integration-uri "http://${IP}:8080/solicitudes/{proxy}" > /dev/null || true
              [ -n "$INT_SOL_APR" ] && aws apigatewayv2 update-integration --api-id "$API_ID" --integration-id "$INT_SOL_APR" --integration-uri "http://${IP}:8080/solicitudes/{id}/aprobar" > /dev/null || true
              [ -n "$INT_SOL_REC" ] && aws apigatewayv2 update-integration --api-id "$API_ID" --integration-id "$INT_SOL_REC" --integration-uri "http://${IP}:8080/solicitudes/{id}/rechazar" > /dev/null || true
              echo "IP_TASK=$IP" >> "$GITHUB_ENV"
            fi
          else
            echo "API_ID no definido en variables de repositorio. Se omite reapunte."
          fi

      - name: Resumen del Despliegue
        if: always()
        env:
          API_URL: ${{ vars.API_URL }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then
              echo "### Backend desplegado exitosamente: \`$TAG\`"
              echo ""
              echo "| Recurso | Destino |"
              echo "|---------|---------|"
              echo "| Task IP | \`http://${IP_TASK:-IP_NO_RESUELTA}:8080\` |"
              echo "| Health  | \`http://${IP_TASK:-IP_NO_RESUELTA}:8080/actuator/health\` |"
              echo "| API URL | ${API_URL:-No configurada en vars.API_URL} |"
            else
              echo "### El despliegue del backend ha fallado"
              echo "Revisa los registros con: \`aws logs tail /ecs/${{ vars.ECS_SERVICE || 'dsy1107-backend-matias-araos' }} --follow\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
