# Pedidos360 · EP3/EP4: cluster RabbitMQ de 3 nodos + microservicios de mensajeria.
#   docker compose up -d --build --wait
#   docker exec rabbitmq-1 rabbitmqctl cluster_status
x-nodo: &nodo
  image: rabbitmq:4-management
  environment:
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin123}
    # Secreto compartido: si difiere, el nodo arranca solo ("Invalid challenge reply")
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-pedidos360_cluster_cookie}
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
    interval: 10s
    timeout: 10s
    retries: 12
  networks: [rabbitmq_cluster]
  restart: unless-stopped

x-ms: &ms
  environment:
    RABBITMQ_ADDRESSES: rabbitmq-1:5672,rabbitmq-2:5672,rabbitmq-3:5672
    RABBITMQ_USER: ${RABBITMQ_USER:-admin}
    RABBITMQ_PASS: ${RABBITMQ_PASS:-admin123}
  depends_on:
    rabbitmq-1: { condition: service_healthy }
    rabbitmq-2: { condition: service_healthy }
    rabbitmq-3: { condition: service_healthy }
  networks: [rabbitmq_cluster]
  restart: unless-stopped

services:
  rabbitmq-1:
    <<: *nodo
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    ports: ["5672:5672", "15672:15672"]
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
  rabbitmq-2:
    <<: *nodo
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    ports: ["5673:5672", "15673:15672"]
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
  rabbitmq-3:
    <<: *nodo
    container_name: rabbitmq-3
    hostname: rabbitmq-3
    ports: ["5674:5672", "15674:15672"]
    volumes:
      - rabbitmq_data_3:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  pedidos-mensajeria-ms:
    <<: *ms
    build: ./pedidos-mensajeria-ms
    image: ${IMAGEN_EVENTOS:-pedidos360/pedidos-mensajeria-ms:local}
    container_name: pedidos-mensajeria-ms
    ports: ["8091:8091"]
    profiles: [apps]

  rabbit-admin-ms:
    <<: *ms
    build: ./rabbit-admin-ms
    image: ${IMAGEN_ADMIN:-pedidos360/rabbit-admin-ms:local}
    container_name: rabbit-admin-ms
    ports: ["8097:8097"]
    profiles: [apps]

volumes:
  rabbitmq_data_1:
  rabbitmq_data_2:
  rabbitmq_data_3:

networks:
  rabbitmq_cluster:
