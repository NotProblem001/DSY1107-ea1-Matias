# =============================================================================
# Pedidos360 - Unidad 3: Apache Kafka (guia 3.2.1)
# Levantar:  docker compose up -d
# Kafka-UI:  http://localhost:8085
# Bajar:     docker compose down   (agrega -v para borrar los datos)
# =============================================================================
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pedidos360-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    # persistir ZK junto con kafka_data: si no, tras "down" ZK genera otro cluster id y Kafka no arranca
    volumes:
      - zk_data:/var/lib/zookeeper/data
      - zk_log:/var/lib/zookeeper/log
    networks:
      - kafka_net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pedidos360-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # kafka:29092 para contenedores de la red, localhost:9092 para el microservicio en el host
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - kafka_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pedidos360-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - kafka_net

  # Solo con "docker compose --profile apps up -d" (asi se usa en la EC2); en local se corre con mvnw.
  pedidos-streaming-ms:
    build: ./pedidos-streaming-ms
    image: ${IMAGEN_STREAMING:-pedidos360/pedidos-streaming-ms:local}
    container_name: pedidos-streaming-ms
    profiles: [apps]
    depends_on:
      - kafka
    ports:
      - "8092:8092"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      ORIGEN_SECRETO: ${ORIGEN_SECRETO:-}
    restart: unless-stopped
    networks:
      - kafka_net

volumes:
  kafka_data:
  zk_data:
  zk_log:

networks:
  kafka_net:
